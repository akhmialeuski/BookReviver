[project]
name = "bookreviver"
version = "0.1.0"
description = "Digitisation workbench for old printed books, one project per book"
readme = "README.md"
requires-python = ">=3.14"

# Every pin below is the latest release on PyPI as of 2026-09-26.
dependencies = [
    # Runtime dependencies
    "advanced-alchemy==1.11.0",
    "aiosmtplib==5.1.3",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "dishka==1.10.1",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "fastapi-pagination==0.16.0",
    "fastapi-problem==0.12.1",
    "fastapi-users[oauth]==15.0.5",
    "fractional-indexing==0.1.3",
    "httpx-oauth==0.17.0",
    "pillow==12.3.0",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "pyvips[binary]==3.2.0",
    "slowapi==0.1.10",
    "sqlalchemy[asyncio]==2.0.54",
    "taskiq==0.13.0",
    # Dev and test dependencies
    "delayed-assert==0.4.2",
    "httpx==0.28.1",
    "import-linter==2.15",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    # UV build backend
    "uv_build==0.12.19",
    # Linters and type checkers
    "mypy==2.3.1",
    "pyrefly==1.3.1",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[project.scripts]
# advanced-alchemy's migration commands on the database the settings name, such as `bookreviver-migrate upgrade head`
bookreviver-migrate = "bookreviver.app.migrate:migrate"
# Writes the OpenAPI schema the frontend client is generated from to docs/openapi.json
bookreviver-openapi = "bookreviver.app.openapi:main"

# Processing plugins, found by the catalogue in the application through importlib.metadata.entry_points. An external
# package registers its own processors in this group in the same way
[project.entry-points."bookreviver.processors"]
"split.none" = "bookreviver.plugins.split_none:SplitNone"
"pages.blank" = "bookreviver.plugins.blank:BlankPage"
"pages.content" = "bookreviver.plugins.content_type:ContentTypeProbe"
"split.spread" = "bookreviver.plugins.split_spread:SplitSpread"
"split.auto" = "bookreviver.plugins.split_auto:SplitAuto"
"geometry.perspective" = "bookreviver.plugins.perspective:Perspective"
"geometry.deskew" = "bookreviver.plugins.deskew:Deskew"
"geometry.dewarp" = "bookreviver.plugins.dewarp:Dewarp"
"geometry.crop" = "bookreviver.plugins.crop:Crop"
"geometry.normalize" = "bookreviver.plugins.normalize:Normalize"
"cleanup.binarize" = "bookreviver.plugins.binarize:Binarize"
"cleanup.despeckle" = "bookreviver.plugins.despeckle:Despeckle"
"cleanup.eraser" = "bookreviver.plugins.eraser:Eraser"
"cleanup.thickness" = "bookreviver.plugins.thickness:Thickness"

[project.optional-dependencies]
cv = [
    "opencv-python-headless>=5.0.0.93",
    # Runs the UVDoc model of geometry.dewarp on the CPU
    "onnxruntime>=1.23.0",
    # The local thresholds of the Doxa framework, which the step cleanup.binarize computes its black and white with
    "doxapy>=0.9.9",
]

[tool.fastapi]
entrypoint = "bookreviver.app.asgi:app"

[build-system]
requires = ["uv_build>=0.12,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookreviver"]

[tool.pytest.ini_options]
# Tests run in parallel, one worker per CPU; `-n 0` runs them in one process, as a debugger needs
addopts = "--strict-markers --strict-config -n auto"
testpaths = ["tests"]
# A deprecation raised from the project's own modules fails the run, since the project can fix it. One raised inside a
# dependency, such as the `declarative_mixin` call of advanced-alchemy under SQLAlchemy 2.1, is only the dependency's
# to fix, so the scope is the module field, which pytest matches as a regular expression from the start of the name
filterwarnings = ["error::DeprecationWarning:bookreviver"]

[tool.importlinter]
root_package = "bookreviver"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inwards: app, then api, adapters and plugins, then services, ports, domain"
type = "layers"
layers = [
    "bookreviver.app",
    "bookreviver.api | bookreviver.adapters | bookreviver.plugins",
    "bookreviver.services",
    "bookreviver.ports",
    "bookreviver.domain",
]

[[tool.importlinter.contracts]]
name = "Adapter families are independent of each other"
type = "independence"
modules = ["bookreviver.adapters.*"]

[[tool.importlinter.contracts]]
name = "The core imports no framework and no I/O library"
type = "forbidden"
source_modules = ["bookreviver.domain", "bookreviver.ports", "bookreviver.services"]
forbidden_modules = [
    "advanced_alchemy",
    "cv2",
    "aiosmtplib",
    "dishka",
    "fastapi",
    "fastapi_users",
    "httpx",
    "httpx_oauth",
    "PIL",
    "pydantic",
    "pydantic_settings",
    "pymupdf",
    "pyvips",
    "sqlalchemy",
    "starlette",
    "taskiq",
]

# Type-checker configuration

[tool.mypy]
ignore_missing_imports = true
# Understands BaseSettings reading the environment and the coercion of field inputs
plugins = ["pydantic.mypy"]
# `mypy .` would otherwise walk the uploaded books in data/ and the frontend dependencies looking for Python files
exclude = ['^data/', '^frontend/', '^\.e2e-data/']
# The type information of the libraries that ship none, kept in the repository
mypy_path = "stubs"

[tool.pyrefly]
project-excludes = [
    "tests",
]
search-path = ["stubs"]

[tool.ty.environment]
extra-paths = ["stubs"]

[tool.ty.rules]
# TY rules at https://docs.astral.sh/ty/reference/rules/
deprecated = "error"
all = "error"
ambiguous-protocol-member = "error"
division-by-zero = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
undefined-reveal = "error"
unresolved-global = "error"
unresolved-import = "error"
unsupported-base = "error"
unused-ignore-comment = "error"
useless-overload-body = "error"

[[tool.ty.overrides]]
# SQLAlchemy's documented `x: Mapped[T] = mapped_column()` form assigns a MappedColumn, which is
# assignable to Mapped but not a subtype of it; mypy and pyrefly accept the idiom
include = [
    "src/bookreviver/adapters/persistence/sqlalchemy/accounts.py",
    "src/bookreviver/adapters/persistence/sqlalchemy/tables.py",
]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

[tool.ty.src]
include = [
    "src",
    "tests",
]

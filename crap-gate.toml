# Opts this project into the crap-gate-edit hook and sets the limits it enforces after every agent edit.
# The same numbers belong in the ruff configuration and the crap-gate script, so the hook and the gate agree.
[limits]
complexity = 8
max_args = 5
function_lines = 50
file_lines = 500

# The size baseline the hook reads: a recorded function or file may keep its length, and one more line is refused.
[baseline]
size = "size-baseline.json"

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Support cheatsheet:
# uv run pre-commit install --install-hooks
# uv run pre-commit run --all-files
# uv run pre-commit autoupdate --freeze -j 4
# uv run pre-commit gc

default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  # Standard checks and fixers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # CHECKERS
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # FIXERS
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: sort-simple-yaml
        args: [ --remove ]
      - id: pretty-format-json
        args: [ --autofix, --no-sort-keys ]
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]

  # Import absolutification
  - repo: https://github.com/MarcoGorelli/absolufy-imports
    rev: 1683a63d850e065495c05b771e4a20db010a58e7  # frozen: v0.3.1
    hooks:
      - id: absolufy-imports

  # Python version upgrade
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # frozen: v3.21.2
    hooks:
      - id: pyupgrade
        args: [ --py314-plus ]

  # Auto walrus operator
  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: 1743edbed52f3d61886b59d98a27164a8af29c0d  # frozen: 0.4.1
    hooks:
      - id: auto-walrus
        args: [ --line-length=120 ]          # Must match ruff.toml line-length

  # Ruff: lint + format (3 passes — order matters)
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b  # frozen: v0.16.6
    hooks:
      # Pass 1: fix import sorting
      - id: ruff-check
        name: ruff check imports
        args: [ --select=I, --fix ]
        types_or: [ python, pyi ]
      # Pass 2: format code
      - id: ruff-format
      # Pass 3: lint all rules with auto-fix
      - id: ruff-check
        args: [ --fix ]
        types_or: [ python, pyi ]

  # UV dependency sync
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d153933366256874470b9d8395de436c50714f41  # frozen: 0.12.9
    hooks:
      # Runs after every checkout, merge and rebase too, so it syncs the optional groups the checks and the plugins
      # need: a plain sync would remove OpenCV and leave out a dependency or entry point that a branch adds to them
      - id: uv-sync
        args: [ --locked, --all-extras ]

  # Type checkers (all three REQUIRED — local hooks)
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty
        args: [ check, "." ]
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy type check
        entry: uv run mypy
        args: [ "." ]
        language: system
        pass_filenames: false
      - id: pyrefly
        name: pyrefly type check
        entry: uv run pyrefly
        args: [ check ]
        language: system
        types: [ python ]
        pass_filenames: false
      - id: import-linter
        name: import-linter layer contracts
        entry: uv run lint-imports
        language: system
        types: [ python ]
        pass_filenames: false
      - id: no-literal-status-codes
        name: HTTP status codes come from fastapi.status or http.HTTPStatus
        entry: '\b(status_code|status)\s*(==|!=|=)\s*[1-5][0-9]{2}\b'
        language: pygrep
        types: [ python ]

{# Header and stage tabs shared by every page of a project. Expects `project` and `active_stage`. #}
<div class="project-header">
  <h1>{{ project.title }}</h1>
  <a href="/projects/{{ project.id }}/settings">Book details</a>
</div>
<nav class="tabs" aria-label="Stages">
  {% for stage in stages %}
    <a href="/projects/{{ project.id }}/stages/{{ stage.value }}"
       {% if stage == active_stage %}class="active" aria-current="page"{% endif %}>{{ stage.label }}</a>
  {% endfor %}
</nav>

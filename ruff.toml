ignore = [
    # Broad category ignores
    "ERA", # eradicate: commented-out code detection (too noisy)
    "FIX", # fixme: TODO/FIXME comments (tracked separately)
    "S", # bandit: security checks (handled by security review, not linter)
    "TD", # todos: TODO format enforcement (tracked separately)

    # Formatter compatibility (required when using ruff format)
    "missing-trailing-comma", # missing-trailing-comma
    "prohibited-trailing-comma", # prohibited-trailing-comma
    "docstring-tab-indentation", # indent-with-spaces
    "indentation-with-invalid-multiple", # indentation-with-invalid-multiple
    "indentation-with-invalid-multiple-comment", # indentation-with-invalid-multiple-comment
    "over-indented", # over-indented
    "bad-quotes-inline-string", # bad-quotes-inline-string
    "bad-quotes-multiline-string", # bad-quotes-multiline-string
    "bad-quotes-docstring", # bad-quotes-docstring
    "avoidable-escaped-quote", # avoidable-escaped-quote

    # Project-wide policy ignores
    "undocumented-public-init", # missing docstring in __init__ (not required)
    "multi-line-summary-second-line", # multi-line docstring summary at second line (conflicts with D212)
    "docstring-missing-returns", # return not in docstring
    "docstring-missing-yields", # yield not in docstring (pydoclint rules parse Google and NumPy sections only, not reST)
    "docstring-missing-exception", # exception not in docstring
    "missing-copyright-notice", # missing copyright header
    "error-suffix-on-exception-name", # exception name Error suffix (too strict)
    "no-self-use", # method could be function/static (too noisy)
    "hardcoded-bind-all-interfaces", # binding to all interfaces (intentional in lab/CI)
    "hardcoded-password-string", # hardcoded password (intentional in lab/CI)
    "hardcoded-password-func-arg", # hardcoded password in argument (intentional in lab/CI)
    "hardcoded-temp-file", # insecure temp file usage (acceptable in CI)
    "suspicious-non-cryptographic-random-usage", # pseudo-random generators (not doing crypto)
]

# Rules to address over time — remove one by one and fix
extend-ignore = [
    "any-type", # typing.Any disallowed
    "undocumented-param", # missing argument descriptions in docstring
    "mixed-case-variable-in-class-scope", # mixedCase in class scope
    "ambiguous-unicode-character-docstring", # ambiguous character in docstring
]

exclude = [
    "*.pyi", ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".nox", ".pants.d", ".pytest_cache",
    ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__",
    "_build", "buck-out", "build", "dist", "node_modules", "venv",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# Invariant — every project has these two
"__init__.py" = [
    "module-import-not-at-top-of-file", # import violations
    "unused-import", # unused imports
]
"tests/**" = [
    "unused-lambda-argument", # unused lambda argument
    "undocumented-public-method", # missing docstring in public method
    "undocumented-public-package", # missing docstring in public package
    "line-too-long", # line too long
    "compare-to-empty-string", # compare to empty string
    "unnecessary-dunder-call", # unnecessary encode
    "magic-value-comparison", # magic value in comparison
    "pytest-fixture-param-without-value", # fixture without value
    "unnecessary-assign", # unnecessary assignment before return
    "private-member-access", # private member access
    "print", # `print` found — tests use prints
    "typing-only-standard-library-import", # move import into TYPE_CHECKING
]

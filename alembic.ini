# Alembic CLI configuration for developers, e.g. `uv run alembic revision --autogenerate -m "..."`.
# The application applies migrations itself at startup; the database URL comes from BOOKREVIVER_* settings.
[alembic]
script_location = %(here)s/src/bookreviver/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
